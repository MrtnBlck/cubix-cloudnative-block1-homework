name: HW1

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build the application with Maven
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
          server-id: github
          cache: maven
      - name: Build with Maven
        run: ./mvnw package
      - name: Upload artifact for publish job
        uses: actions/upload-artifact@v7
        with:
          name: java-app
          path: "${{ github.workspace }}/target/*.jar"
  publish:
    name: Create and publish a Docker image
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Download the artifact from build job
        uses: actions/download-artifact@v8
        with:
          name: java-app
      - name: Logging into Docker
        run: docker login ghcr.io -u mrtnblck -p ${{ github.token }}
      - name: Build the Docker image
        run: docker build . -t ghcr.io/mrtnblck/cubix/1/homework/app:springboot
      - name: Push the Docker image
        run: docker push ghcr.io/mrtnblck/cubix/1/homework/app:springboot
  verify:
    name: Verify the resulting Docker image
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Running verification script
        run: ./verify-image.sh
